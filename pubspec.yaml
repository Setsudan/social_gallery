name: social_gallery
description: Local-first social-style photo gallery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  photo_manager: ^3.6.4
  photo_manager_image_provider: ^2.2.0
  permission_handler: ^11.4.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  video_player: ^2.11.1
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  workmanager: 0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
